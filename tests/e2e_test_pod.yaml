apiVersion: v1
kind: Pod
metadata:
  name: interlink-htcondor-test
spec:
  restartPolicy: Never
  containers:
  - name: busybox
    image: docker://busybox:latest
    command:
      - sleep
      - "10"
    resources:
      requests:
        memory: "100Mi"
        cpu: "1"
  nodeSelector:
    kubernetes.io/hostname: virtual-kubelet
  tolerations:
  - key: virtual-node.interlink/no-schedule
    operator: Exists
